# Builds sim/home.yaml with this checkout's ESPHome and boots it on Simantic's simulated ESP32-C3.
name: sim
on:
  pull_request:
  push:
    branches: [ship-demo]
jobs:
  firmware-in-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('esphome/const.py') }}
      - name: Build firmware
        run: pip install -e . && sim/build.sh
      - name: Install sim
        env:
          SIM_ID: ${{ secrets.SIM_ID }}
        run: |
          curl -fsSL https://simantic.com/install | sh -s -- --no-login --quiet
          printf '%s' "$SIM_ID" > ~/.sim_id
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run firmware in sim
        run: sim/test.sh
